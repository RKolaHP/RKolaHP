<svg
width="1200"
height="620"
viewBox="0 0 1200 620"
fill="none"
xmlns="http://www.w3.org/2000/svg"

>

  <defs>

```
<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620">
  <stop offset="0%" stop-color="#05070D"/>
  <stop offset="48%" stop-color="#100A1F"/>
  <stop offset="100%" stop-color="#03171B"/>
</linearGradient>

<!-- Main gradient -->
<linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#9D7CFF"/>
  <stop offset="48%" stop-color="#00E5FF"/>
  <stop offset="100%" stop-color="#9CFF57"/>
</linearGradient>

<linearGradient id="greenSignal" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#9CFF57"/>
  <stop offset="100%" stop-color="#00E5FF"/>
</linearGradient>

<!-- Glow -->
<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="18"/>
</filter>

<!-- Grid -->
<pattern
  id="grid"
  width="40"
  height="40"
  patternUnits="userSpaceOnUse"
>
  <path
    d="M 40 0 L 0 0 0 40"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.045"
    stroke-width="1"
  />
</pattern>

<pattern
  id="microgrid"
  width="10"
  height="10"
  patternUnits="userSpaceOnUse"
>
  <path
    d="M 10 0 L 0 0 0 10"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.018"
    stroke-width="0.5"
  />
</pattern>

<!-- Moving signal -->
<circle id="packet" r="3" fill="#9CFF57" filter="url(#glow)">
  <animate
    attributeName="opacity"
    values="0;1;1;0"
    dur="2.4s"
    repeatCount="indefinite"
  />
</circle>
```

