<svg width="1400" height="500" viewBox="0 0 1400 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- ================= BACKGROUND ================= -->

<linearGradient id="bg"
x1="0" y1="0"
x2="1" y2="1">

<stop offset="0%" stop-color="#03040A"/>
<stop offset="45%" stop-color="#0B0820"/>
<stop offset="100%" stop-color="#02151B"/>

</linearGradient>

<linearGradient id="signal"
x1="0" y1="0"
x2="1" y2="0">

<stop offset="0%" stop-color="#A855F7"/>
<stop offset="45%" stop-color="#22D3EE"/>
<stop offset="75%" stop-color="#9CFF57"/>
<stop offset="100%" stop-color="#FFFFFF"/>

</linearGradient>

<radialGradient id="core">

<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
<stop offset="12%" stop-color="#22D3EE" stop-opacity=".65"/>
<stop offset="35%" stop-color="#A855F7" stop-opacity=".3"/>
<stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>

</radialGradient>

<radialGradient id="purple">

<stop offset="0%" stop-color="#A855F7" stop-opacity=".3"/>
<stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>

</radialGradient>

<radialGradient id="cyan">

<stop offset="0%" stop-color="#22D3EE" stop-opacity=".22"/>
<stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>

</radialGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="5"/>

</filter>

<filter id="bigGlow">

<feGaussianBlur stdDeviation="25"/>

</filter>

<pattern id="grid"
width="50"
height="50"
patternUnits="userSpaceOnUse">

<path
d="M50 0H0V50"
fill="none"
stroke="#FFFFFF"
stroke-opacity=".035"/>

</pattern>

<pattern id="micro"
width="10"
height="10"
patternUnits="userSpaceOnUse">

<path
d="M10 0H0V10"
fill="none"
stroke="#22D3EE"
stroke-opacity=".018"/>

</pattern>

</defs>


<!-- ================= WORLD ================= -->

<rect width="1400" height="500" rx="22" fill="url(#bg)"/>

