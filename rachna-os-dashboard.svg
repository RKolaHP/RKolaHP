<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="760"
     viewBox="0 0 1400 760">

  <defs>

    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#111820"/>

    </linearGradient>

    <linearGradient id="core"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#06090d"/>

    </linearGradient>

    <pattern id="grid"
             width="36"
             height="36"
             patternUnits="userSpaceOnUse">

      <path
        d="M36 0H0V36"
        fill="none"
        stroke="#26313a"
        stroke-width="1"/>

    </pattern>

    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1400"
    height="760"
    rx="24"
    fill="url(#background)"/>


  <!-- GRID -->

  <rect
    x="24"
    y="24"
    width="1352"
    height="712"
    rx="18"
    fill="url(#grid)"
    stroke="#39444f"
    stroke-width="1"/>


  <!-- HEADER -->

  <g font-family="monospace">

    <text
      x="62"
      y="72"
      fill="#ffffff"
      font-size="30"
      font-weight="700">
      RACHNA.OS
    </text>

    <text
      x="62"
      y="103"
      fill="#8996a2"
      font-size="14">
      A LIVING DATA UNIVERSE // SYSTEM INITIALIZED // 2026
    </text>


    <!-- STATUS -->

    <circle
      cx="1320"
      cy="72"
      r="8"
      fill="#9cff57"
      filter="url(#glow)"/>

    <text
      x="1270"
      y="103"
      fill="#9cff57"
      font-size="13">
      SYSTEM ONLINE
    </text>

  </g>


  <!-- MODE PANEL -->

  <rect
    x="62"
    y="145"
    width="245"
    height="46"
    rx="8"
    fill="#0a1016"
    stroke="#39444f"/>

  <g font-family="monospace">

    <text
      x="80"
      y="174"
      fill="#8996a2"
      font-size="12">
      MODE
    </text>

    <text
      x="235"
      y="174"
      fill="#ffffff"
      font-size="12"
      text-anchor="end">
      BUILD
    </text>

  </g>


  <!-- SIGNAL PANEL -->

  <rect
    x="1093"
    y="145"
    width="245"
    height="46"
    rx="8"
    fill="#0a1016"
    stroke="#39444f"/>

  <g font-family="monospace">

    <text
      x="1111"
      y="174"
      fill="#8996a2"
      font-size="12">
      SIGNAL
    </text>

    <text
      x="1319"
      y="174"
      fill="#9cff57"
      font-size="12"
      text-anchor="end">
      ● ACTIVE
    </text>

  </g>


  <!-- CONNECTION NETWORK -->

  <g
    stroke="#53606b"
    stroke-width="1"
    fill="none"
    opacity="0.9">

    <path d="M700 365 L290 205"/>
    <path d="M700 365 L1110 205"/>
    <path d="M700 365 L290 525"/>
    <path d="M700 365 L1110 525"/>

    <path d="M290 205 L1110 205"/>
    <path d="M290 525 L1110 525"/>

    <path d="M290 205 L290 525"/>
    <path d="M1110 205 L1110 525"/>

  </g>


  <!-- CORE -->

  <circle
    cx="700"
    cy="365"
    r="112"
    fill="url(#core)"
    stroke="#9cff57"
    stroke-width="2"
    filter="url(#glow)"/>

  <circle
    cx="700"
    cy="365"
    r="88"
    fill="none"
    stroke="#46535e"
    stroke-width="1"
    stroke-dasharray="5 8"/>


  <g font-family="monospace"
     text-anchor="middle">

    <text
      x="700"
      y="350"
      fill="#9cff57"
      font-size="13">
      CORE SIGNAL
    </text>

    <text
      x="700"
      y="378"
      fill="#ffffff"
      font-size="25"
      font-weight="700">
      DATA → AI
    </text>

    <text
      x="700"
      y="402"
      fill="#9da8b2"
      font-size="12">
      INTELLIGENCE → DECISION
    </text>

  </g>


  <!-- WORLD NODES -->

  <g
    fill="#0b1117"
    stroke="#7b8792"
    stroke-width="2">

    <circle cx="290" cy="205" r="70"/>
    <circle cx="1110" cy="205" r="70"/>
    <circle cx="290" cy="525" r="70"/>
    <circle cx="1110" cy="525" r="70"/>

  </g>


  <!-- WORLD LABELS -->

  <g
    font-family="monospace"
    text-anchor="middle">

    <!-- RISK -->

    <text
      x="290"
      y="198"
      fill="#9cff57"
      font-size="12">
      WORLD_01
    </text>

    <text
      x="290"
      y="221"
      fill="#ffffff"
      font-size="23">
      RISK
    </text>


    <!-- VISION -->

    <text
      x="1110"
      y="198"
      fill="#9cff57"
      font-size="12">
      WORLD_02
    </text>

    <text
      x="1110"
      y="221"
      fill="#ffffff"
      font-size="23">
      VISION
    </text>


    <!-- SIGNAL -->

    <text
      x="290"
      y="518"
      fill="#9cff57"
      font-size="12">
      WORLD_03
    </text>

    <text
      x="290"
      y="541"
      fill="#ffffff"
      font-size="23">
      SIGNAL
    </text>


    <!-- NEURAL -->

    <text
      x="1110"
      y="518"
      fill="#9cff57"
      font-size="12">
      WORLD_04
    </text>

    <text
      x="1110"
      y="541"
      fill="#ffffff"
      font-size="23">
      NEURAL
    </text>

  </g>


  <!-- WORLD 05 -->

  <g
    font-family="monospace"
    text-anchor="middle">

    <text
      x="700"
      y="675"
      fill="#9cff57"
      font-size="14">
      WORLD_05 // TRUTH
    </text>

  </g>


  <!-- FOOTER -->

  <g font-family="monospace">

    <text
      x="62"
      y="696"
      fill="#596672"
      font-size="11">
      HEALTHCARE // CYBERSECURITY // ROBOTICS // CREATIVE TECHNOLOGY
    </text>

    <text
      x="1338"
      y="696"
      fill="#596672"
      font-size="11"
      text-anchor="end">
      RACHNA // DATA × AI × DESIGN
    </text>

  </g>

</svg>
