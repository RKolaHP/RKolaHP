<svg width="1400"
height="620"
viewBox="0 0 1400 620"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- ================= SPACE ================= -->

<radialGradient id="space"
cx="50%"
cy="50%"
r="75%">

<stop offset="0%" stop-color="#130F2A"/>
<stop offset="38%" stop-color="#080917"/>
<stop offset="75%" stop-color="#03050B"/>
<stop offset="100%" stop-color="#010207"/>

</radialGradient>


<!-- ================= SIGNAL ================= -->

<linearGradient id="signal"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%" stop-color="#A855F7"/>
<stop offset="45%" stop-color="#22D3EE"/>
<stop offset="75%" stop-color="#9CFF57"/>
<stop offset="100%" stop-color="#FFFFFF"/>

</linearGradient>


<!-- ================= GLOWS ================= -->

<radialGradient id="purpleGlow">

<stop offset="0%" stop-color="#A855F7" stop-opacity=".35"/>
<stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>

</radialGradient>


<radialGradient id="cyanGlow">

<stop offset="0%" stop-color="#22D3EE" stop-opacity=".28"/>
<stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>

</radialGradient>


<radialGradient id="greenGlow">

<stop offset="0%" stop-color="#9CFF57" stop-opacity=".2"/>
<stop offset="100%" stop-color="#9CFF57" stop-opacity="0"/>

</radialGradient>


<filter id="blur">

<feGaussianBlur stdDeviation="15"/>

</filter>


<filter id="bigBlur">

<feGaussianBlur stdDeviation="35"/>

</filter>


<!-- ================= STARS ================= -->

<pattern
id="stars"
width="180"
height="150"
patternUnits="userSpaceOnUse">

<circle cx="20" cy="30" r="1" fill="#FFFFFF" opacity=".35"/>
<circle cx="90" cy="60" r=".7" fill="#22D3EE" opacity=".5"/>
<circle cx="140" cy="20" r=".8" fill="#FFFFFF" opacity=".25"/>
<circle cx="45" cy="115" r=".8" fill="#A855F7" opacity=".45"/>
<circle cx="155" cy="120" r=".6" fill="#9CFF57" opacity=".4"/>

</pattern>


<!-- ================= GRID ================= -->

<pattern
id="grid"
width="70"
height="70"
patternUnits="userSpaceOnUse">

<path
d="M70 0H0V70"
fill="none"
stroke="#22D3EE"
stroke-opacity=".025"/>

</pattern>

</defs>


<!-- ================= UNIVERSE ================= -->

<rect
width="1400"
height="620"
rx="24"
fill="url(#space)"/>

<rect
width="1400"
height="620"
