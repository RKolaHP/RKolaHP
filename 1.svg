<?xml version="1.0" encoding="UTF-8"?>

<svg
  width="1200"
  height="380"
  viewBox="0 0 1200 380"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080F"/>
      <stop offset="48%" stop-color="#100D25"/>
      <stop offset="100%" stop-color="#061A22"/>
    </linearGradient>

    <!-- =========================================================
         ACCENT SYSTEM
         ========================================================= -->

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="52%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#9CFF57"/>
    </linearGradient>

    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- =========================================================
         AMBIENT GLOWS
         ========================================================= -->

    <radialGradient id="glowPurple">
      <stop offset="0%" stop-color="#A855F7" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================================================
         FILTERS
         ========================================================= -->

    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- =========================================================
         GRID
         ========================================================= -->

    <pattern
      id="grid"
      width="42"
      height="42"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M42 0H0V42"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".045"
      />
    </pattern>

    <pattern
      id="microGrid"
      width="10"
      height="10"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M10 0H0V10"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity=".018"
      />
    </pattern>

    <!-- =========================================================
         TYPOGRAPHY
         ========================================================= -->

    <style>

      .mono {
        font-family:
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          monospace;
      }

      .sans {
        font-family:
          "Inter",
          "Segoe UI",
          Arial,
          sans-serif;
      }

      .tiny {
        font-size: 10px;
        letter-spacing: 1.8px;
      }

      .small {
        font-size: 12px;
        letter-spacing: 1.3px;
      }

      .label {
        font-size: 11px;
        letter-spacing: 2px;
      }

    </style>

  </defs>


  <!-- ===========================================================
       RACHNA.OS BACKGROUND
       =========================================================== -->

  <rect
    width="1200"
    height="380"
    rx="26"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="380"
    rx="26"
    fill="url(#grid)"
  />

  <rect
    width="1200"
    height="380"
    rx="26"
    fill="url(#microGrid)"
  />


  <!-- ===========================================================
       AMBIENT LIGHT
       =========================================================== -->

  <circle
    cx="170"
    cy="80"
    r="220"
    fill="url(#glowPurple)"
    filter="url(#blur)"
  />

  <circle
    cx="1010"
    cy="280"
    r="240"
    fill="url(#glowCyan)"
    filter="url(#blur)"
  />


  <!-- ===========================================================
       DATA STREAMS
       =========================================================== -->

  <g
    opacity=".35"
    stroke="url(#accent)"
    fill="none"
  >

    <path
      d="
        M35 300
        C180 245, 230 330, 370 275
        S610 210, 760 260
        S1010 320, 1160 250
      "
      stroke-width="1"
    />

    <path
      d="
        M50 320
        C200 265, 250 350, 390 295
        S620 230, 770 280
        S1010 340, 1150 270
      "
      stroke-width=".7"
    />

  </g>


