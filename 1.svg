    </text>

  </g>


  <!-- ===========================================================
       ANIMATED SCANLINE
       =========================================================== -->

  <rect
    x="25"
    y="65"
    width="1150"
    height="1"
    fill="#22D3EE"
    opacity=".18"
  >

    <animate
      attributeName="y"
      values="65;345;65"
      dur="7s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ===========================================================
       CORNER SYSTEM MARKERS
       =========================================================== -->

  <g
    stroke="url(#accent)"
